<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — CyberKnight</title>
  <link rel="stylesheet" href="/assets/tailwind.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-950 flex items-center justify-center p-4">
  <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-white/15 text-cyan-300 flex items-center justify-center text-3xl"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-key-round"></use></svg></div>
    <h1 class="text-2xl font-extrabold text-white mb-3">Đặt lại mật khẩu</h1>

    <!-- Error state -->
    <div id="error-box" class="hidden bg-red-500/20 border border-red-500/40 rounded-xl p-4 mb-4 text-left">
      <p id="error-message" class="text-red-200 text-sm"></p>
    </div>

    <!-- Success state -->
    <div id="success-box" class="hidden bg-green-500/20 border border-green-500/40 rounded-xl p-4 mb-4 text-left">
      <p class="text-green-200 text-sm"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-circle-check"></use></svg> Mật khẩu đã được đặt lại thành công!</p>
    </div>

    <!-- New password form -->
    <div id="reset-form">
      <p class="text-indigo-200 mb-6 text-sm leading-relaxed">
        Nhập mật khẩu mới cho tài khoản của bạn.
      </p>
      <form id="form-reset" class="text-left space-y-4">
        <div>
          <label for="password" class="block text-indigo-200 text-sm mb-1">Mật khẩu mới</label>
          <input type="password" id="password" name="password"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-300 focus:outline-none focus:border-cyan-400 transition"
            placeholder="Tối thiểu 8 ký tự" required minlength="8" autocomplete="new-password">
        </div>
        <div>
          <label for="confirm" class="block text-indigo-200 text-sm mb-1">Xác nhận mật khẩu</label>
          <input type="password" id="confirm" name="confirmPassword"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-300 focus:outline-none focus:border-cyan-400 transition"
            placeholder="Nhập lại mật khẩu mới" required>
        </div>
        <button type="submit" id="btn-submit"
          class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-white font-bold py-3 rounded-full text-lg shadow-lg transition-all duration-200 transform hover:scale-105">
          Đặt lại mật khẩu
        </button>
      </form>
    </div>

    <p class="text-indigo-400 text-sm mt-6">
      <a href="/index.html" class="hover:text-indigo-200 transition"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"></use></svg> Quay về trang chủ</a>
    </p>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('error-box').classList.remove('hidden');
        document.getElementById('error-message').textContent = 'Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu link mới.';
        document.getElementById('reset-form').classList.add('hidden');
        return;
      }

      // Verify token first
      fetch('/api/auth/verify-reset-token?token=' + encodeURIComponent(token))
        .then(r => r.json())
        .then(data => {
          if (!data.valid) {
            document.getElementById('error-box').classList.remove('hidden');
            document.getElementById('error-message').textContent = data.message || 'Link đặt lại mật khẩu đã hết hạn hoặc đã được sử dụng.';
            document.getElementById('reset-form').classList.add('hidden');
          }
        })
        .catch(() => {
          // On network error, still show form so user can try
        });

      document.getElementById('form-reset').addEventListener('submit', async function(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const btn = document.getElementById('btn-submit');

        if (password !== confirm) {
          document.getElementById('error-box').classList.remove('hidden');
          document.getElementById('error-message').textContent = 'Mật khẩu xác nhận không khớp.';
          return;
        }

        if (password.length < 8) {
          document.getElementById('error-box').classList.remove('hidden');
          document.getElementById('error-message').textContent = 'Mật khẩu phải có ít nhất 8 ký tự.';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Đang xử lý...';
        document.getElementById('error-box').classList.add('hidden');

        try {
          const resp = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password })
          });
          const data = await resp.json();

          if (data.success) {
            document.getElementById('reset-form').classList.add('hidden');
            document.getElementById('success-box').classList.remove('hidden');
          } else {
            document.getElementById('error-box').classList.remove('hidden');
            document.getElementById('error-message').textContent = data.message || 'Đặt lại mật khẩu thất bại.';
            btn.disabled = false;
            btn.textContent = 'Đặt lại mật khẩu';
          }
        } catch {
          document.getElementById('error-box').classList.remove('hidden');
          document.getElementById('error-message').textContent = 'Lỗi kết nối. Vui lòng thử lại.';
          btn.disabled = false;
          btn.textContent = 'Đặt lại mật khẩu';
        }
      });
    })();
  </script>
</body>
</html>
